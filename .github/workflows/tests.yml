name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install MediaPipe system libraries
        run: sudo apt-get update && sudo apt-get install -y libgles2 libegl1
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile application
        run: python -m compileall -q app.py web_ui.py biomechanics.py pose_analyzer.py report_generator.py shot_evaluation.py video_intelligence.py vision_models.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run browser analyzer unit tests
        run: node --test tests_js/*.test.mjs
